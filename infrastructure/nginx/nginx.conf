# Docker embedded DNS
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# Dynamically resolved upstream services
upstream web_backend {
    zone web_backend 64k;
    server web:80 resolve;
}

upstream api_backend {
    zone api_backend 64k;
    server api:8080 resolve;
}

upstream keycloak_backend {
    zone keycloak_backend 64k;
    server keycloak:8080 resolve;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name _;

    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location / {
        return 308 https://$host:3443$request_uri;
    }
}

# HTTPS gateway
server {
    listen 443 ssl;
    server_name localhost securebank.lab;

    server_tokens off;

    ssl_certificate /etc/nginx/certs/securebank.crt;
    ssl_certificate_key /etc/nginx/certs/securebank.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SecureBankTLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # API
    location ^~ /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 3443;
    }

    # Keycloak
    location ^~ /auth/ {
        proxy_pass http://keycloak_backend/;
        proxy_http_version 1.1;

        proxy_hide_header Strict-Transport-Security;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 3443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /auth;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Gateway health check
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Frontend
    location / {
        proxy_pass http://web_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}