services:

  web:
    build:
      context: ./frontend
    container_name: securebank-web
    ports:
      - "3000:80"
      - "3443:443"
    volumes:
      - ./.certs/securebank.crt:/etc/nginx/certs/securebank.crt:ro
      - ./.certs/securebank.key:/etc/nginx/certs/securebank.key:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: src/SecureBank.Api/Dockerfile
    container_name: securebank-api
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - securebank-api-keys:/home/app/.aspnet/DataProtection-Keys
      - ./.certs/securebank.pfx:/https/securebank.pfx:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080;https://+:8443"
      ASPNETCORE_Kestrel__Certificates__Default__Path: "/https/securebank.pfx"
      ASPNETCORE_Kestrel__Certificates__Default__Password: "${SECUREBANK_CERT_PASSWORD}"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=securebank;Username=securebank;Password=securebank_dev_password"
      Keycloak__Authority: "http://keycloak:8080/realms/securebank"
      Keycloak__Issuer: "https://localhost:3443/auth/realms/securebank"
      Keycloak__Audience: "securebank-api"
      Keycloak__RequireHttpsMetadata: "false"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - /usr/bin/bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:18
    container_name: securebank-postgres
    environment:
      POSTGRES_DB: securebank
      POSTGRES_USER: securebank
      POSTGRES_PASSWORD: securebank_dev_password
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - securebank-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securebank -d securebank"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: securebank-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev_password
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: "https://localhost:3443/auth"
    ports:
      - "8081:8080"
    volumes:
      - securebank-keycloak-data:/opt/keycloak/data
      - ./infrastructure/keycloak/securebank-realm.json:/opt/keycloak/data/import/securebank-realm.json:ro

volumes:
  securebank-api-keys:
  securebank-postgres-data:
  securebank-keycloak-data:
